# Upscalers, the same picks as the Picture tab's: the app sets each one up (VSR needs the player's size,
# AnimeJaNai its folder, filter and engines). Ctrl+0 turns it off.

CTRL+1  script-message aowave-upscaler anime4k
CTRL+2  script-message aowave-upscaler animejanai
CTRL+3  script-message aowave-upscaler vsr
CTRL+4  script-message aowave-upscaler artcnn
CTRL+5  script-message aowave-upscaler artcnn-fast
CTRL+0  script-message aowave-upscaler off; set deband-iterations 4; set deband-threshold 35; set deband-range 16; set deband-grain 4

b       cycle deband; show-text "Debanding: ${deband}"

CTRL+b  set deband yes; set deband-iterations 4; set deband-threshold 80; set deband-range 24; set deband-grain 12; show-text "Deband: max"
