# The app sets the video output (gpu-next on Direct3D 11) and hwdec: do not set vo, gpu-api, gpu-context,
# d3d11-output-mode, hwdec or keep-open here. No glsl-shaders in profiles: profile-restore=copy joins
# them with ':', which splits Windows drive letters.

profile=gpu-hq

osd-bar=no
osd-font-size=32
save-position-on-quit=no

volume=100
volume-max=200
alang=jpn,ja,eng,en
audio-file-auto=fuzzy

slang=eng,en
sub-auto=fuzzy
sub-font-size=40
sub-border-size=1.5
demuxer-mkv-subtitle-preroll=yes

# AnimeJaNai changes its filter slot on the player loop (25-50 ms, about 400 ms the first time or with RIFE): a deeper
# audio buffer rides that out without a gap in the sound. A volume change is heard after the buffer plays out.
audio-buffer=0.6

screenshot-format=png
screenshot-png-compression=4
screenshot-high-bit-depth=yes
screenshot-directory="~~/screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

dither-depth=auto
dither=fruit

# Whether debanding is on is the Picture tab's say (or the b key); these are how strong it is.
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36
correct-downscaling=yes

linear-downscaling=no
sigmoid-upscaling=yes

scale-antiring=0.5
dscale-antiring=0.5
cscale-antiring=0.5

[4k-downscale]
profile-desc=4K downscaling tuning
profile-cond=width >= 3840 or height >= 2160
profile-restore=copy
dscale=mitchell
dscale-antiring=0.6
linear-downscaling=no
deband-iterations=2
deband-grain=2

[hd-upscale]
profile-desc=HD upscaling tuning
profile-cond=width >= 1280 and width < 3840 and height >= 720 and height < 2160
profile-restore=copy
scale=ewa_lanczos
scale-blur=0.981251
cscale=spline36

[sd-upscale]
profile-desc=SD upscaling tuning
profile-cond=width < 1280 and height < 720
profile-restore=copy
deband-iterations=4
deband-grain=5
